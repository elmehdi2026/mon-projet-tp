name: Deploy Smart Contract CI/CD

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Configuration de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installation des dépendances
      run: |
        python -m pip install --upgrade pip
        pip install web3 python-dotenv py-solc-x

    - name: Exécution du script de déploiement Python
      env:
      # Injection sécurisée des secrets configurés sur GitHub
        WEB3_PROVIDER_URI: ${{ secrets.WEB3_PROVIDER_URI }}
        PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      run: |
        python deploy.py

    - name: Commit et push automatique du config.json mis à jour
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add config.json
        git commit -m "ci: mise à jour automatique de l'adresse du contrat [skip ci]" || exit 0
        git push